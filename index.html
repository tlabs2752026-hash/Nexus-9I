<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus 9I</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- INTER FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #ffffff;
            color: #10233f;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 4%;

            background: #ffffff;

            border-bottom: 1px solid #e7edf5;

            position: relative;
            z-index: 1000;
        }


        /* LOGO */

        .logo-link {
            display: flex;
            align-items: center;

            text-decoration: none;
        }

        .logo {
            height: 52px;
            width: auto;

            display: block;
            object-fit: contain;
        }


        /* LOGIN BUTTON */

        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 12px 24px;

            border-radius: 10px;

            background: #1677ed;
            color: #ffffff;

            text-decoration: none;

            font-size: 15px;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #0d63cc;

            transform: translateY(-2px);

            box-shadow:
                0 8px 24px rgba(22, 119, 237, 0.25);
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            position: relative;

            width: 100%;

            /*
                Wide horizontal hero.
            */
            height: calc(100vh - 78px);
            min-height: 620px;

            overflow: hidden;

            display: flex;
            align-items: center;

            background: #06244a;
        }


        /* GROUP PHOTO */

        .group-photo {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            /*
                Keeps the class photo horizontal and
                fills the wide hero area.
            */
            object-position: center center;

            z-index: 1;
        }


        /* =====================================================
           BLUE OVERLAY
        ===================================================== */

        .hero-overlay {
            position: absolute;

            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    90deg,

                    rgba(2, 24, 51, 0.98) 0%,

                    rgba(3, 34, 70, 0.94) 22%,

                    rgba(4, 45, 88, 0.78) 42%,

                    rgba(5, 52, 99, 0.43) 65%,

                    rgba(5, 52, 99, 0.15) 100%
                );
        }


        /* =====================================================
           HERO CONTENT
        ===================================================== */

        .hero-content {
            position: relative;

            z-index: 3;

            width: 100%;

            padding: 60px 8%;

            color: #ffffff;
        }


        /* SMALL LABEL */

        .eyebrow {
            display: inline-flex;
            align-items: center;

            padding: 9px 18px;

            margin-bottom: 26px;

            border: 1px solid rgba(52, 154, 255, 0.7);

            border-radius: 50px;

            background: rgba(12, 111, 224, 0.16);

            color: #a5d8ff;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 1px;
        }


        /* MAIN HEADING */

        .hero h1 {
            max-width: 780px;

            font-size: clamp(50px, 6.5vw, 88px);

            line-height: 1.02;

            letter-spacing: -3.5px;

            font-weight: 800;

            margin-bottom: 26px;
        }

        .hero h1 span {
            color: #1685ff;
        }


        /* DESCRIPTION */

        .hero-description {
            max-width: 600px;

            margin-bottom: 36px;

            color: #d8e9fa;

            font-size: 19px;

            line-height: 1.65;

            font-weight: 400;
        }


        /* ENTER BUTTON */

        .enter-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            padding: 15px 27px;

            border-radius: 10px;

            background: #087cff;

            color: #ffffff;

            text-decoration: none;

            font-size: 16px;

            font-weight: 700;

            transition: 0.2s ease;
        }

        .enter-button:hover {
            background: #3194ff;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(8, 124, 255, 0.35);
        }


        /* ARROW */

        .arrow {
            font-size: 20px;

            transition: transform 0.2s ease;
        }

        .enter-button:hover .arrow {
            transform: translateX(5px);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #041528;

            color: #9bb0c6;

            font-size: 13px;

            text-align: center;
        }


        /* =====================================================
           LARGE SCREENS
        ===================================================== */

        @media (min-width: 1400px) {

            header {
                padding: 0 3%;
            }

            .hero-content {
                padding-left: 7%;
            }

            .hero h1 {
                font-size: 88px;
            }
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 900px) {

            header {
                height: 72px;

                padding: 0 5%;
            }

            .logo {
                height: 47px;
            }

            .hero {
                height: calc(100vh - 72px);

                min-height: 600px;
            }

            .hero-content {
                padding: 50px 7%;
            }

            .hero h1 {
                font-size: 58px;

                letter-spacing: -2.5px;
            }

            .hero-description {
                font-size: 17px;
            }

            .hero-overlay {
                background:
                    linear-gradient(
                        90deg,
                        rgba(2, 24, 51, 0.97) 0%,
                        rgba(3, 42, 82, 0.78) 60%,
                        rgba(3, 42, 82, 0.35) 100%
                    );
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            header {
                height: 68px;

                padding: 0 5%;
            }

            .logo {
                height: 42px;
            }

            .login-button {
                padding: 10px 17px;

                font-size: 13px;
            }

            .hero {
                height: calc(100vh - 68px);

                min-height: 600px;
            }

            .hero-content {
                padding: 45px 6%;
            }

            .eyebrow {
                font-size: 11px;

                padding: 8px 13px;

                letter-spacing: 0.6px;
            }

            .hero h1 {
                font-size: 46px;

                letter-spacing: -2px;
            }

            .hero-description {
                font-size: 15px;

                line-height: 1.6;
            }

            .enter-button {
                width: 100%;

                padding: 14px 20px;
            }

            /*
                On mobile, show more of the group
                photo instead of cropping too much.
            */
            .group-photo {
                object-position: center center;
            }

            .hero-overlay {
                background:
                    linear-gradient(
                        90deg,
                        rgba(2, 24, 51, 0.96) 0%,
                        rgba(3, 42, 82, 0.82) 55%,
                        rgba(3, 42, 82, 0.50) 100%
                    );
            }

            footer {
                height: 64px;

                font-size: 12px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <!-- NEXUS 9I LOGO -->
        <a href="index.html" class="logo-link">

            <img
                src="logo.png"
                alt="Nexus 9I"
                class="logo"
            >

        </a>


        <!-- LOGIN -->
        <a
            href="login.html"
            class="login-button"
        >
            Login
        </a>

    </header>



    <!-- =====================================================
         HERO
    ===================================================== -->

    <main>

        <section class="hero">


            <!-- GROUP PHOTO -->

            <img
                src="group.jpeg"
                alt="Nexus 9I Class Group Photo"
                class="group-photo"
            >


            <!-- BLUE GRADIENT -->

            <div class="hero-overlay"></div>


            <!-- CONTENT -->

            <div class="hero-content">

                <div class="eyebrow">
                    CLASS 9I&nbsp;&nbsp;•&nbsp;&nbsp;NEXUS PORTAL
                </div>


                <h1>
                    One portal for the <span>9I.</span>
                </h1>


                <p class="hero-description">
                    A single digital space for the students,
                    teachers and administrators of Class 9I.
                </p>


                <a
                    href="login.html"
                    class="enter-button"
                >
                    Enter Nexus 9I

                    <span class="arrow">
                        →
                    </span>

                </a>

            </div>

        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer>

        © 2026 Nexus 9I • Class 9I Portal

    </footer>


</body>
</html>
