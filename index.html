<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus 9I</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", Arial, sans-serif;
            background: #ffffff;
            color: #17284d;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 78px;
            width: 100%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            border-bottom: 1px solid #e8edf5;
            position: relative;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            color: #17284d;
            letter-spacing: -0.5px;
        }

        .login-btn {
            text-decoration: none;
            background: #315eba;
            color: #ffffff;
            padding: 11px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .login-btn:hover {
            background: #244b99;
            transform: translateY(-1px);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;
            height: calc(100vh - 78px);
            min-height: 620px;
            overflow: hidden;
            background: #06244a;
        }

        .group-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /*
            Dark overlay for readable text.
            The right side is intentionally lighter
            so the group photo remains visible.
        */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;

            background:
                linear-gradient(
                    90deg,
                    rgba(2, 24, 51, 0.96) 0%,
                    rgba(3, 34, 70, 0.86) 24%,
                    rgba(4, 45, 88, 0.62) 45%,
                    rgba(5, 52, 99, 0.30) 68%,
                    rgba(5, 52, 99, 0.08) 100%
                );
        }

        .hero-content {
            position: relative;
            z-index: 3;

            height: 100%;
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 60px 6%;
        }

        .eyebrow {
            color: #a9c7ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .hero h1 {
            color: #ffffff;
            font-size: clamp(48px, 6vw, 82px);
            line-height: 1.02;
            letter-spacing: -3px;
            max-width: 720px;
            margin-bottom: 24px;
        }

        .hero-description {
            color: #dce9fb;
            font-size: 18px;
            line-height: 1.7;
            max-width: 590px;
            margin-bottom: 34px;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: fit-content;

            padding: 14px 24px;
            border-radius: 8px;

            background: #315eba;
            color: #ffffff;

            text-decoration: none;
            font-size: 15px;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .enter-btn:hover {
            background: #4270ca;
            transform: translateY(-2px);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #ffffff;
            border-top: 1px solid #e8edf5;
            padding: 20px 6%;
            text-align: center;

            color: #667085;
            font-size: 13px;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 900px) {

            header {
                padding: 0 5%;
            }

            .hero-content {
                padding: 50px 5%;
            }

            .hero h1 {
                max-width: 600px;
            }

            .hero-description {
                max-width: 520px;
            }

            .hero-overlay {
                background:
                    linear-gradient(
                        90deg,
                        rgba(2, 24, 51, 0.96) 0%,
                        rgba(3, 34, 70, 0.88) 38%,
                        rgba(5, 52, 99, 0.42) 75%,
                        rgba(5, 52, 99, 0.16) 100%
                    );
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header {
                height: 70px;
                padding: 0 20px;
            }

            .brand img {
                width: 36px;
                height: 36px;
            }

            .brand-name {
                font-size: 18px;
            }

            .login-btn {
                padding: 9px 15px;
                font-size: 13px;
            }

            .hero {
                height: calc(100vh - 70px);
                min-height: 600px;
            }

            .group-photo {
                object-position: center;
            }

            .hero-overlay {
                background:
                    linear-gradient(
                        180deg,
                        rgba(2, 24, 51, 0.88) 0%,
                        rgba(3, 34, 70, 0.78) 45%,
                        rgba(3, 34, 70, 0.72) 100%
                    );
            }

            .hero-content {
                padding: 40px 24px;
                justify-content: center;
            }

            .eyebrow {
                font-size: 11px;
                letter-spacing: 1.5px;
                margin-bottom: 14px;
            }

            .hero h1 {
                font-size: 45px;
                letter-spacing: -2px;
                margin-bottom: 20px;
            }

            .hero-description {
                font-size: 15px;
                line-height: 1.6;
                margin-bottom: 28px;
            }

            .enter-btn {
                width: 100%;
                max-width: 250px;
                padding: 13px 20px;
            }

            footer {
                padding: 18px 20px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <a href="index.html" class="brand">
            <img src="logo.png" alt="Nexus 9I Logo">
            <span class="brand-name">Nexus 9I</span>
        </a>

        <a href="login.html" class="login-btn">
            Login
        </a>

    </header>


    <!-- =========================
         HERO / LANDING PAGE
    ========================== -->

    <main class="hero">

        <!-- Class group photograph -->
        <img
            src="group.jpg"
            alt="Nexus 9I Class Group Photo"
            class="group-photo"
        >

        <!-- Text readability overlay -->
        <div class="hero-overlay"></div>

        <!-- Main content -->
        <section class="hero-content">

            <div class="eyebrow">
                Class 9I • Nexus Portal
            </div>

            <h1>
                One portal<br>
                for the 9I.
            </h1>

            <p class="hero-description">
                Nexus 9I brings students, teachers and school information
                together in one simple digital portal.
            </p>

            <a href="login.html" class="enter-btn">
                Enter Nexus 9I
            </a>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>
        © 2026 Nexus 9I • Class 9I Portal
    </footer>

</body>
</html>
